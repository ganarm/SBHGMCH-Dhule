<div class="page-hero">
  <div class="container">
    <h1>Notices & announcements</h1>
    <p>Important updates, admission circulars, and institute news. In production, staff publish these from the admin panel.</p>
  </div>
</div>

<div class="container page-body">
  <div class="notice-list">
    @for (n of notices; track n.title) {
      <article class="notice-item">
        @if (n.tag) {
          <span class="notice-tag">{{ n.tag }}</span>
        }
        <h2><a class="link-btn" [routerLink]="n.link">{{ n.title }}</a></h2>
      </article>
    }
  </div>
</div>
